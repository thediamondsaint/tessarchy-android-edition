<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Tessarchy Android Edition — an exploded view of Tessa and Android layers</title>
  <desc id="desc">A layered architecture diagram. Tessa's launcher and interaction design sit above Tessarchy system apps and Android system interface, the Android framework and AOSP, device integration, and the Linux kernel and phone hardware. Each layer shows what can be customized.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c2b"/><stop offset=".55" stop-color="#142b3c"/><stop offset="1" stop-color="#0b1724"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8fff0"/><stop offset=".48" stop-color="#88e6cc"/><stop offset="1" stop-color="#53bca8"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ae7ec"/><stop offset="1" stop-color="#4a9fb1"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b3346" stop-opacity=".96"/><stop offset="1" stop-color="#142638" stop-opacity=".96"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="12"/><feColorMatrix type="matrix" values="0 0 0 0 0.01 0 0 0 0 0.04 0 0 0 0 0.08 0 0 0 .55 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#b7e9e9" stroke-opacity=".045" stroke-width="1"/></pattern>
    <style>
      .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:46px;font-weight:750;letter-spacing:2.1px;fill:#f2fbff}.sub{font-size:19px;fill:#a6bfca;letter-spacing:.35px}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:2.3px;fill:#7ecfba}.layer{font-size:17px;font-weight:750;letter-spacing:1.05px;fill:#f1fbff}.layerSub{font-size:12px;letter-spacing:1.2px;fill:#91b1bf}
      .descHead{font-size:16px;font-weight:700;fill:#e9f8fa}.desc{font-size:14px;fill:#9db7c2}.tag{font-size:10px;font-weight:750;letter-spacing:1.1px;fill:#173343}
      .line{stroke:#76d8c2;stroke-opacity:.45;stroke-width:1.4;stroke-dasharray:4 7}.dim{fill:#87a5b2}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="url(#bg)"/>
  <rect width="1800" height="1200" fill="url(#grid)"/>
  <circle cx="1540" cy="180" r="300" fill="#46bba7" opacity=".055"/>
  <circle cx="1555" cy="180" r="200" fill="none" stroke="#89e5d0" stroke-opacity=".09"/>

  <!-- Tessarchy tessellated T mark -->
  <g transform="translate(92 72) scale(.55)">
    <path fill="url(#mint)" d="M64 9 90 24 64 39 38 24Z"/><path fill="#a6edd7" d="m10 40 26-15 26 15-26 15Z"/>
    <path fill="#65baa9" d="m66 40 26-15 26 15-26 15Z"/><path fill="url(#mint)" d="m39 59 25-15 25 15-25 15Z"/>
    <path fill="#8ce1c9" d="m39 64 23 14v35L39 99Z"/><path fill="#4b9f94" d="m66 78 23-14v35l-23 14Z"/>
  </g>
  <text x="170" y="99" class="sans title">TESSARCHY ANDROID EDITION</text>
  <text x="172" y="137" class="sans sub">Tessa becomes the experience layer. Android keeps the phone running.</text>
  <text x="104" y="208" class="sans eyebrow">EXPLODED SYSTEM STACK</text>
  <text x="1096" y="208" class="sans eyebrow">WHAT YOU CAN SHAPE</text>
  <path d="M104 228H1692" stroke="#8db9c3" stroke-opacity=".22"/>

  <!-- Exploded stack cards. Each layer floats above the next. -->
  <!-- 1 Tessa experience -->
  <g filter="url(#shadow)">
    <path d="M112 286 190 244H928L850 286Z" fill="#c7fff0" fill-opacity=".25" stroke="#b8ffeb" stroke-opacity=".72"/>
    <path d="M850 286 928 244V329L850 372Z" fill="#438f86" stroke="#81dfc6" stroke-opacity=".55"/>
    <path d="M112 286H850V372H112Z" fill="url(#panel)" stroke="#8fe9d1" stroke-width="1.5"/>
    <path d="M112 286H850V372H112Z" fill="#88e6cc" opacity=".075"/>
    <text x="145" y="321" class="sans layer">TESSA EXPERIENCE</text>
    <text x="145" y="345" class="sans layerSub">HOME · APP DRAWER · GESTURES · PHONE / TABLET LAYOUTS</text>
    <g transform="translate(672 300)">
      <rect width="145" height="52" rx="12" fill="#0d1d2a" stroke="#72d5bd" stroke-opacity=".8"/>
      <rect x="9" y="8" width="127" height="7" rx="3.5" fill="#b3f1de" opacity=".7"/>
      <rect x="9" y="22" width="58" height="22" rx="7" fill="#356b6a"/><rect x="72" y="22" width="27" height="22" rx="7" fill="#294f61"/><rect x="104" y="22" width="32" height="22" rx="7" fill="#294f61"/>
    </g>
    <rect x="783" y="258" width="96" height="21" rx="10.5" fill="#a8f2dc"/><text x="831" y="272" class="sans tag" text-anchor="middle">DESIGN FREEDOM</text>
  </g>
  <path d="M962 299H1043" class="line"/><circle cx="962" cy="299" r="3" fill="#82e2c9"/>
  <text x="1096" y="277" class="sans descHead">Make Tessa the home</text>
  <text x="1096" y="301" class="sans desc">Visual language, launcher, app grid, search, gestures,</text>
  <text x="1096" y="321" class="sans desc">touch targets, responsive layouts and motion.</text>

  <!-- 2 Tessarchy system experience -->
  <g filter="url(#shadow)">
    <path d="M112 428 190 386H928L850 428Z" fill="#9fead9" fill-opacity=".2" stroke="#8de0ce" stroke-opacity=".64"/>
    <path d="M850 428 928 386V471L850 514Z" fill="#356d73" stroke="#67cbbd" stroke-opacity=".5"/>
    <path d="M112 428H850V514H112Z" fill="url(#panel)" stroke="#68cfbf" stroke-width="1.4"/>
    <path d="M112 428H850V514H112Z" fill="#59c7b5" opacity=".055"/>
    <text x="145" y="463" class="sans layer">TESSARCHY SYSTEM EXPERIENCE</text>
    <text x="145" y="487" class="sans layerSub">SYSTEM UI · QUICK SETTINGS · NOTIFICATIONS · SETTINGS</text>
    <g transform="translate(710 448)" fill="none" stroke="#a8e9df" stroke-width="1.6" opacity=".9">
      <rect width="28" height="28" rx="8"/><path d="M8 14h12M14 8v12"/><rect x="37" width="28" height="28" rx="8"/><path d="M45 9h12M45 14h12M45 19h8"/><rect x="74" width="28" height="28" rx="8"/><circle cx="88" cy="14" r="7"/><path d="m88 10 2.2 4-2.2 4-2.2-4z"/>
    </g>
    <rect x="782" y="400" width="102" height="21" rx="10.5" fill="#89e6d4"/><text x="833" y="414" class="sans tag" text-anchor="middle">DEEP CONTROL</text>
  </g>
  <path d="M962 441H1043" class="line"/><circle cx="962" cy="441" r="3" fill="#82e2c9"/>
  <text x="1096" y="419" class="sans descHead">Shape the system surfaces</text>
  <text x="1096" y="443" class="sans desc">Replace or extend Android’s System UI, settings,</text>
  <text x="1096" y="463" class="sans desc">navigation, notification shade and quick controls.</text>

  <!-- 3 Tessarchy apps -->
  <g filter="url(#shadow)">
    <path d="M112 570 190 528H928L850 570Z" fill="#86d7d3" fill-opacity=".18" stroke="#75caca" stroke-opacity=".58"/>
    <path d="M850 570 928 528V613L850 656Z" fill="#315c71" stroke="#5aaeba" stroke-opacity=".52"/>
    <path d="M112 570H850V656H112Z" fill="url(#panel)" stroke="#5daec0" stroke-width="1.4"/>
    <text x="145" y="605" class="sans layer">TESSARCHY APPS &amp; SERVICES</text>
    <text x="145" y="629" class="sans layerSub">PHONE · MESSAGES · ASSISTANT · MEDIA · ACCESSIBILITY</text>
    <g transform="translate(727 590)" fill="#90d8df" opacity=".85"><circle cx="10" cy="10" r="7"/><circle cx="35" cy="10" r="7"/><circle cx="60" cy="10" r="7"/><path d="M6 26h8v8H6zM31 26h8v8h-8zM56 26h8v8h-8z"/></g>
    <rect x="795" y="542" width="86" height="21" rx="10.5" fill="#81dce0"/><text x="838" y="556" class="sans tag" text-anchor="middle">YOUR APPS</text>
  </g>
  <path d="M962 583H1043" class="line"/><circle cx="962" cy="583" r="3" fill="#82e2c9"/>
  <text x="1096" y="561" class="sans descHead">Build the Tessarchy toolkit</text>
  <text x="1096" y="585" class="sans desc">Choose defaults and create companion apps that</text>
  <text x="1096" y="605" class="sans desc">work with Android’s phone, media and accessibility APIs.</text>

  <!-- 4 Android framework -->
  <g filter="url(#shadow)">
    <path d="M112 712 190 670H928L850 712Z" fill="#74bfd0" fill-opacity=".18" stroke="#68b6ce" stroke-opacity=".58"/>
    <path d="M850 712 928 670V755L850 798Z" fill="#31526d" stroke="#5598bb" stroke-opacity=".5"/>
    <path d="M112 712H850V798H112Z" fill="url(#panel)" stroke="#519cbe" stroke-width="1.4"/>
    <text x="145" y="747" class="sans layer">ANDROID FRAMEWORK &amp; AOSP</text>
    <text x="145" y="771" class="sans layerSub">APP RUNTIME · PERMISSIONS · ACTIVITY MODEL · PLATFORM SERVICES</text>
    <g transform="translate(741 733)" fill="none" stroke="#91cbe0" stroke-width="1.7"><path d="M0 12 20 0l20 12-20 12z"/><path d="M12 19 32 7l20 12-20 12z"/><path d="m24 26 20-12 20 12-20 12z"/></g>
    <rect x="790" y="684" width="94" height="21" rx="10.5" fill="#75c3dc"/><text x="837" y="698" class="sans tag" text-anchor="middle">AOSP SOURCE</text>
  </g>
  <path d="M962 725H1043" class="line"/><circle cx="962" cy="725" r="3" fill="#82e2c9"/>
  <text x="1096" y="703" class="sans descHead">Customize the platform</text>
  <text x="1096" y="727" class="sans desc">Set product defaults and overlays; change platform</text>
  <text x="1096" y="747" class="sans desc">code where Tessarchy needs deeper behavior.</text>

  <!-- 5 device integration -->
  <g filter="url(#shadow)">
    <path d="M112 854 190 812H928L850 854Z" fill="#6a9fbd" fill-opacity=".18" stroke="#6098bd" stroke-opacity=".55"/>
    <path d="M850 854 928 812V897L850 940Z" fill="#2b4665" stroke="#4d83a9" stroke-opacity=".52"/>
    <path d="M112 854H850V940H112Z" fill="url(#panel)" stroke="#4e8db5" stroke-width="1.4"/>
    <text x="145" y="889" class="sans layer">DEVICE INTEGRATION</text>
    <text x="145" y="913" class="sans layerSub">VENDOR HALs · CAMERA · MODEM · AUDIO · SENSORS · POWER</text>
    <g transform="translate(744 875)" fill="none" stroke="#88b9d4" stroke-width="1.6"><rect x="0" y="0" width="31" height="31" rx="7"/><path d="M8 0v-5M16 0v-5M24 0v-5M8 36v-5M16 36v-5M24 36v-5M0 8h-5M0 16h-5M0 24h-5M36 8h-5M36 16h-5M36 24h-5"/><circle cx="16" cy="16" r="6"/></g>
    <rect x="785" y="826" width="99" height="21" rx="10.5" fill="#679fc2"/><text x="834" y="840" class="sans tag" text-anchor="middle">DEVICE-SPECIFIC</text>
  </g>
  <path d="M962 867H1043" class="line"/><circle cx="962" cy="867" r="3" fill="#82e2c9"/>
  <text x="1096" y="845" class="sans descHead">Adapt to one reference phone</text>
  <text x="1096" y="869" class="sans desc">Connect Android’s hardware interfaces and the</text>
  <text x="1096" y="889" class="sans desc">device maker’s components for calls, camera and power.</text>

  <!-- 6 foundation -->
  <g filter="url(#shadow)">
    <path d="M112 996 190 954H928L850 996Z" fill="#6786a5" fill-opacity=".18" stroke="#6988a8" stroke-opacity=".55"/>
    <path d="M850 996 928 954V1039L850 1082Z" fill="#273955" stroke="#486582" stroke-opacity=".56"/>
    <path d="M112 996H850V1082H112Z" fill="url(#panel)" stroke="#496c8e" stroke-width="1.4"/>
    <text x="145" y="1031" class="sans layer">LINUX KERNEL &amp; PHONE HARDWARE</text>
    <text x="145" y="1055" class="sans layerSub">BOOT · DISPLAY · TOUCH · STORAGE · RADIO · SECURE ELEMENT</text>
    <g transform="translate(749 1015)" fill="none" stroke="#89abc4" stroke-width="1.6"><rect width="46" height="38" rx="7"/><path d="M9 10h28M9 18h28M9 26h19M-5 8v22M51 8v22"/></g>
    <rect x="785" y="968" width="99" height="21" rx="10.5" fill="#526f8c"/><text x="834" y="982" class="sans tag" text-anchor="middle" fill="#d2e6ef">HARDWARE BASE</text>
  </g>
  <path d="M962 1009H1043" class="line"/><circle cx="962" cy="1009" r="3" fill="#82e2c9"/>
  <text x="1096" y="987" class="sans descHead">Keep the phone foundation</text>
  <text x="1096" y="1011" class="sans desc">Kernel and hardware drivers make the chosen phone</text>
  <text x="1096" y="1031" class="sans desc">boot, display, connect and stay powered.</text>

  <path d="M104 1120H1692" stroke="#8db9c3" stroke-opacity=".22"/>
  <text x="104" y="1155" class="sans eyebrow">TESSARCHY DESIGN ABOVE</text>
  <text x="365" y="1155" class="sans sub" font-size="15">AOSP foundation below</text>
  <text x="1692" y="1155" text-anchor="end" class="sans mono dim" font-size="12">A NEW PHONE OS · A SHARED TESSARCHY IDENTITY</text>
</svg>
